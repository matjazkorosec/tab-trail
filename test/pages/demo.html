<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner shop</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: #2a2420; background: #f6f1ea; }
header { display: flex; align-items: center; gap: 40px; padding: 22px 56px; background: #fff; border-bottom: 1px solid #e6ddd2; }
header > a { font-size: 20px; text-decoration: none; }
header nav { display: flex; gap: 28px; }
a { color: #2a2420; }
.menu { position: relative; display: inline-block; margin-left: auto; }
.menu ul { display: none; position: absolute; right: 0; top: 100%; margin: 0; padding: 8px; list-style: none; background: #fff; }
.menu:hover ul { display: block; }
main { display: grid; grid-template-columns: 340px 380px; gap: 48px; padding: 48px 56px; }
.photo { height: 340px; border-radius: 20px; background: linear-gradient(160deg, #f4c9a8, #e8956b); display: grid; place-items: center; }
.tag { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a5a35; margin: 0; }
h1 { font: 600 44px/1.1 Georgia, serif; margin: 8px 0 10px; }
.price { font-size: 22px; margin: 0 0 4px; }
form { display: flex; gap: 8px; margin: 26px 0 0; }
input { font: inherit; flex: 1; padding: 10px 14px; border: 1px solid #c9bdb0; border-radius: 10px; background: #fff; }
button, .fake { font: inherit; display: inline-block; padding: 10px 22px; border: 1px solid #2a2420; border-radius: 999px; background: #fff; text-decoration: none; }
.buy { background: #2a2420; color: #fff; }
.pointer { cursor: pointer; }
.row { display: flex; gap: 12px; align-items: center; margin: 22px 0; }
</style>
</head>
<body>
<header>
<a href="#home"><strong>Corner shop</strong></a>
<nav><a href="#shop">Shop</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
<div class="menu">
<span class="fake">Menu</span>
<ul>
<li><button type="button" tabindex="-1">Profile</button></li>
<li><button type="button" tabindex="-1">Sign out</button></li>
</ul>
</div>
</header>
<main>
<div class="photo" role="img" aria-label="Round sunglasses">
<svg width="220" height="90" viewBox="0 0 220 90" fill="none" stroke="#2a2420" stroke-width="7"><circle cx="58" cy="48" r="36" fill="#3a2f2a"/><circle cx="162" cy="48" r="36" fill="#3a2f2a"/><path d="M94 44c10-10 22-10 32 0M22 40L4 28M198 40l18-12"/></svg>
</div>
<div>
<p class="tag">Summer 2026</p>
<h1>Sunglasses</h1>
<p class="price">39 EUR</p>
<p>Round frames, light as a feather.</p>
<form onsubmit="return false"><input aria-label="Search" placeholder="Search the shop"><button>Search</button></form>
<div class="row">
<span role="button" class="fake pointer buy">Add to cart</span>
<a class="fake pointer">Send</a>
</div>
<p><a href="#returns">Returns</a></p>
</div>
</main>
</body>
</html>
