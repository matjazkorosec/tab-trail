name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run docs
      - run: git diff --exit-code -- dist docs README.md
      - name: Check the tag and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseChangelog } from "./scripts/changelog.mjs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (process.env.TAG !== "v" + version) {
              console.error("Tag " + process.env.TAG + " is not v" + version);
              process.exit(1);
            }
            const entry = parseChangelog(readFileSync("CHANGELOG.md", "utf8")).find((e) => e.v === version);
            if (!entry) {
              console.error("CHANGELOG.md has no entry for " + version);
              process.exit(1);
            }
          '
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Release notes
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { parseChangelog } from "./scripts/changelog.mjs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            const entry = parseChangelog(readFileSync("CHANGELOG.md", "utf8")).find((e) => e.v === version);
            const notes = [entry.summary, ...entry.bullets.map((b) => "- " + b)].filter(Boolean).join("\n\n");
            writeFileSync("notes.md", notes + "\n");
          '
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/tab-trail.js --notes-file notes.md
