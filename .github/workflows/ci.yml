name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Repo checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          SRC_CHANGED=0
          if [ "$EVENT" = "pull_request" ] && [ -n "$(git diff --name-only "origin/$BASE_REF...HEAD" -- src)" ]; then
            SRC_CHANGED=1
          fi
          export SRC_CHANGED
          npm run check
      - run: npm run build
      - run: npm run docs
      - run: git diff --exit-code -- dist docs README.md
      - run: npm test
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
